<!doctype html><html lang="en"><head><link rel="canonical" href="https://mkweli.tech/stories/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1708"><title>Story player · Mkweli Stories</title><meta name="robots" content="noindex, follow"><link rel="stylesheet" href="/stories/assets/player.css">
<script>
 var SLUGS=["kwame","kaya","zara","adila","bikyezi","juma","lila","amani","ayana","zarabee","malik","amina"], slug=new URLSearchParams(location.search).get("story");
 if(SLUGS.indexOf(slug)<0) slug="kwame";
 document.write('<script src="/stories/data/'+slug+'.js"><\/script>');
</script></head>
<body class="player">
<div class="stage">
 <div class="bgblur" id="bg"></div>
 <div class="frame" id="frame"><img id="imA" alt=""><img id="imB" alt=""></div>
 <div class="top"><a id="booklink" href="/stories/">⌂ Stories</a><span id="count">1 / 17</span></div>
 <div class="textcard" id="text" aria-live="polite"></div>
 <div class="dots" id="dots"></div>
 <div class="controls">
  <button class="btn nav" id="back" aria-label="Back">◀ Back</button>
  <button class="btn play" id="play" aria-label="Play">▶ Play</button>
  <button class="btn nav" id="next" aria-label="Next">Next ▶</button>
 </div>
</div>
<div class="overlay" id="quiz"><div class="quiz">
 <h2>What would you do?</h2>
 <p id="qintro"></p>
 <div class="choices" id="choices"></div>
 <p class="fb" id="fb">Tap your idea!</p>
 <button class="btn play" id="again">↺ Read again</button>
 <p><a class="more" id="morelink" href="/stories/">📚 More stories</a></p>
 <p class="credit" id="credit"></p>
</div></div>
<audio id="audio" preload="auto"></audio>
<script src="/stories/assets/player.js"></script>
</body></html>
